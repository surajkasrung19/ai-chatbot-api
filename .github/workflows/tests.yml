name: Chatbot API Tests

on:
  push:
    branches: [main]


  pull_request:
    branches: [main]

  permissions:
    contents: read

  jobs:
    test:
      name: Python 3.13 - Pytest
      runs-on: ubuntu-latest

      steps:
        - name: Checkout repository
          uses: actions/checkout@v6

        - name: Set up Python
          uses: actions/setup-python@v7
          with:
            python-version: "3.13"
            cache: pip

        - name: Install dependencies
          runs: |
            python -m pytest -v --cov=app --cov-report=tern-missing